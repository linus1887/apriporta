<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Shelly Remote</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 680px; width: 100%; }
        h1 { text-align: center; color: #f8fafc; font-size: 22px; margin-bottom: 20px; }
        h2 { font-size: 16px; margin-bottom: 15px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-top: 0; }
        
        /* BARRA SUPERIORE ADMIN */
        .admin-header-actions { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 15px; }
        .btn-change-pass { background-color: #475569; color: #f8fafc; border: none; padding: 8px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-change-pass:hover { background-color: #64748b; }
        .btn-logout { background-color: #ef4444; color: #ffffff; border: none; padding: 8px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background-color: #dc2626; }

        /* STILI NAVIGAZIONE A SCHEDE (TABS) */
        .tab-nav { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 2px solid #334155; }
        .tab-btn { flex: 1; padding: 12px; background-color: #1e293b; color: #94a3b8; border: none; border-top-left-radius: 8px; border-top-right-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .tab-btn.active { background-color: #38bdf8; color: #0f172a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .folder-card { background-color: #1e293b; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; overflow: hidden; }
        .folder-header { background-color: #334155; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .folder-header:hover { background-color: #475569; }
        .folder-title { font-size: 16px; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        .folder-content { padding: 16px; display: none; }
        .folder-card.open .folder-content { display: block; }
        .folder-card.open .folder-header { background-color: #1e293b; border-bottom: 1px solid #334155; }
        
        .house-address { font-size: 13px; color: #94a3b8; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
        .house-address a { color: #38bdf8; text-decoration: none; }
        
        .card { background-color: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #94a3b8; text-transform: uppercase; }
        .req { color: #ef4444; font-weight: bold; }
        
        input, select { width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        
        /* TABELLA PIN OSPITI */
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; }
        .pin-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 500px; }
        .pin-table th { text-align: center; background-color: #0f172a; color: #38bdf8; padding: 10px; border: 1px solid #334155; }
        .pin-table td { padding: 8px; border: 1px solid #334155; background-color: #1e293b; text-align: center; }
        .pin-table input[type="text"], .pin-table input[type="date"] { margin-bottom: 0; padding: 8px 10px; font-size: 13px; }
        .pin-table input[type="checkbox"] { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: #38bdf8; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-add { background-color: #10b981; color: white; margin-top: 5px; }
        .btn-edit { background-color: #f59e0b; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .btn-house-action { color: white; border: none; padding: 8px 10px; font-size: 11px; border-radius: 6px; cursor: pointer; flex: 1; }
        .btn-house-share { background-color: #8b5cf6; }
        .btn-house-regen { background-color: #0284c7; }
        .btn-house-rename { background-color: #f59e0b; }
        .btn-house-delete { background-color: #dc2626; }
        .house-actions-row { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
        .btn-small-add { background-color: #3b82f6; color: white; border: none; padding: 8px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; margin-bottom: 12px; font-weight: bold; }
        
        .device-item { background-color: #0f172a; padding: 16px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .device-title { font-weight: bold; font-size: 16px; color: #f1f5f9; }
        .btn-trigger { background-color: #2563eb; color: white; padding: 14px; font-size: 16px; }
        .btn-trigger:disabled { background-color: #64748b; cursor: not-allowed; }
        .status-msg { font-size: 13px; text-align: center; margin-top: 8px; min-height: 18px; color: #94a3b8; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .keypad-btn { background-color: #334155; color: white; font-size: 20px; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .keypad-btn:active { background-color: #38bdf8; }
        .pin-display-wrapper { position: relative; }
        .pin-display { text-align: center; font-size: 24px; letter-spacing: 8px; margin-bottom: 10px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; min-height: 48px; }
        .keypad-eye-btn { position: absolute; right: 12px; top: 12px; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; user-select: none; }

        /* MODALE LOGIN & EDIT POPUP */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .modal-card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 500px; border: 1px solid #334155; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .modal-card h2 { border: none; margin-bottom: 20px; text-align: center; }
        .login-err { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; text-align: center; }

        /* INPUT PASSWORD CON OCCHIO */
        .password-input-wrapper { position: relative; width: 100%; }
        .password-input-wrapper input { padding-right: 40px; }
        .toggle-password-btn { position: absolute; right: 10px; top: 10px; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 16px; user-select: none; }
    </style>
</head>
<body>

    <!-- OVERLAY LOGIN -->
    <div id="loginOverlay" class="modal-overlay">
        <div class="modal-card" style="max-width: 360px;">
            <h2>🔒 Accesso Riservato</h2>
            <label for="adminPassword" style="text-align: left;">Inserisci Password Admin <span class="req">*</span></label>
            <div class="password-input-wrapper">
                <input type="password" id="adminPassword" placeholder="••••••••" onkeyup="if(event.key==='Enter') verificaPassword()">
                <button type="button" class="toggle-password-btn" id="toggleAdminPasswordBtn" onclick="togglePasswordVisibility('adminPassword', 'toggleAdminPasswordBtn')">👁️</button>
            </div>
            <button class="btn btn-add" onclick="verificaPassword()">Accedi</button>
            <div id="loginError" class="login-err">Password errata! Riprova.</div>
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" onclick="ripristinaPasswordPredefinita()" style="color: #64748b; font-size: 11px; text-decoration: underline;">Password dimenticata? Ripristina di default</a>
            </div>
        </div>
    </div>

    <!-- POPUP CAMBIO PASSWORD ADMIN -->
    <div id="changePassModal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 400px;">
            <h2>🔑 Cambia Password Admin</h2>
            
            <label>Password Attuale <span class="req">*</span></label>
            <div class="password-input-wrapper">
                <input type="password" id="currAdminPass" placeholder="••••••••">
                <button type="button" class="toggle-password-btn" id="btnToggleCurr" onclick="togglePasswordVisibility('currAdminPass', 'btnToggleCurr')">👁️</button>
            </div>

            <label>Nuova Password <span class="req">*</span></label>
            <div class="password-input-wrapper">
                <input type="password" id="newAdminPass" placeholder="Nuova password">
                <button type="button" class="toggle-password-btn" id="btnToggleNew" onclick="togglePasswordVisibility('newAdminPass', 'btnToggleNew')">👁️</button>
            </div>

            <label>Conferma Nuova Password <span class="req">*</span></label>
            <div class="password-input-wrapper">
                <input type="password" id="confirmAdminPass" placeholder="Ripeti nuova password">
                <button type="button" class="toggle-password-btn" id="btnToggleConfirm" onclick="togglePasswordVisibility('confirmAdminPass', 'btnToggleConfirm')">👁️</button>
            </div>

            <button class="btn btn-add" onclick="salvaNuovaPasswordAdmin()">Salva Password</button>
            <button class="btn" onclick="chiudiModalPass()" style="background-color: #64748b; margin-top: 8px;">Annulla</button>
        </div>
    </div>

    <!-- POPUP MODIFICA DISPOSITIVO -->
    <div id="editDeviceModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2>✏️ Modifica Dispositivo</h2>
            <input type="hidden" id="editModalDevId" value="">
            
            <label>Seleziona Casa <span class="req">*</span></label>
            <select id="editModalHouseSelect"></select>

            <label>Cosa apre questo dispositivo? <span class="req">*</span></label>
            <input type="text" id="editModalName" placeholder="es. Portone">

            <label>Modalità di Accesso <span class="req">*</span></label>
            <select id="editModalType" onchange="gestisciTipoAccessoModal()">
                <option value="button">🔘 Tasto diretto</option>
                <option value="pin">🔢 Tastierino numerico (PIN)</option>
            </select>

            <div id="editModalPinContainer" style="display: none;">
                <label>Tabella Gestione PIN Ospiti <span class="req">*</span></label>
                <button type="button" class="btn-small-add" onclick="aggiungiRigaPinTableModal()">+ Aggiungi PIN ospite</button>
                <div class="table-responsive">
                    <table class="pin-table">
                        <thead>
                            <tr>
                                <th style="width: 25%;">Nome</th>
                                <th style="width: 20%;">PIN <span class="req">*</span></th>
                                <th style="width: 10%;">Perm.</th>
                                <th style="width: 20%;">Dal</th>
                                <th style="width: 20%;">Al</th>
                                <th style="width: 5%;"></th>
                            </tr>
                        </thead>
                        <tbody id="editModalPinTableBody"></tbody>
                    </table>
                </div>
            </div>

            <label>Server URL <span class="req">*</span></label>
            <input type="text" id="editModalUrl" placeholder="https://shelly-xxx-eu.shelly.cloud">

            <label>Cloud Key <span class="req">*</span></label>
            <input type="text" id="editModalKey" placeholder="La tua Cloud Key">

            <label>Device ID <span class="req">*</span></label>
            <input type="text" id="editModalId" placeholder="Es. 1x1234567xxx">

            <button class="btn btn-add" onclick="salvaModificheModal()">Salva Modifiche</button>
            <button class="btn" onclick="chiudiModalDispositivo()" style="background-color: #64748b; margin-top: 8px;">Annulla</button>
        </div>
    </div>

    <!-- POPUP MODIFICA CASA -->
    <div id="editHouseModal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 400px;">
            <h2>✏️ Modifica Casa</h2>
            <input type="hidden" id="editHouseModalId" value="">
            
            <label>Nome Casa <span class="req">*</span></label>
            <input type="text" id="editHouseModalName">

            <label>Indirizzo della casa</label>
            <input type="text" id="editHouseModalAddress">

            <button class="btn btn-add" onclick="salvaModificaCasaModal()">Salva Modifiche</button>
            <button class="btn" onclick="chiudiModalCasa()" style="background-color: #64748b; margin-top: 8px;">Annulla</button>
        </div>
    </div>

    <div class="container">
        <h1 id="pageTitle">Controllo Shelly Remote</h1>

        <!-- VISTA OSPITE -->
        <div id="guestView" class="card" style="display: none;">
            <div id="guestHouseHeader"></div>
            <div id="guestDevicesList"></div>
        </div>

        <!-- VISTA AMMINISTRATORE -->
        <div id="adminView" style="display: none;">
            
            <div class="admin-header-actions">
                <button class="btn-change-pass" onclick="apriModalPass()">🔑 Cambia Password Admin</button>
                <button class="btn-logout" onclick="logoutAdmin()">🔒 Esci</button>
            </div>

            <!-- BARRA DI NAVIGAZIONE A SCHEDE -->
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('tab-create')">➕ Aggiungi Dispositivo</button>
                <button class="tab-btn" onclick="switchTab('tab-houses')">🏠 Case e Dispositivi</button>
            </div>

            <!-- SCHEDA 1: CREAZIONE -->
            <div id="tab-create" class="tab-content active">
                <div class="card" id="formCard">
                    <h2>Aggiungi Nuovo Dispositivo</h2>
                    
                    <label>Seleziona Casa <span class="req">*</span></label>
                    <select id="devHouseSelect" onchange="gestisciSelezioneCasa()"></select>

                    <div id="newHouseContainer" style="display: none;">
                        <label>Nome Nuova Casa <span class="req">*</span></label>
                        <input type="text" id="devNewHouse" placeholder="es. Casa mare, Casa città">
                        
                        <label>Indirizzo della Casa</label>
                        <input type="text" id="devHouseAddress" placeholder="es. Via Roma 123, Palermo">
                    </div>

                    <label>Cosa apre questo dispositivo? <span class="req">*</span></label>
                    <input type="text" id="devName" placeholder="es. Portone palazzo, Porta di ingresso, Atrio">

                    <label>Modalità Accesso <span class="req">*</span></label>
                    <select id="devType" onchange="gestisciTipoAccesso()">
                        <option value="button">🔘 Tasto diretto</option>
                        <option value="pin">🔢 Tastierino numerico (PIN)</option>
                    </select>

                    <div id="pinContainer" style="display: none;">
                        <label>Tabella Gestione PIN Ospiti <span class="req">*</span></label>
                        <button type="button" class="btn-small-add" onclick="aggiungiRigaPinTable()">+ Aggiungi PIN ospite</button>
                        
                        <div class="table-responsive">
                            <table class="pin-table">
                                <thead>
                                    <tr>
                                        <th style="width: 25%;">Nome Ospite</th>
                                        <th style="width: 20%;">PIN (4 Cifre) <span class="req">*</span></th>
                                        <th style="width: 10%;">Perm.</th>
                                        <th style="width: 20%;">Dal</th>
                                        <th style="width: 20%;">Al</th>
                                        <th style="width: 5%;"></th>
                                    </tr>
                                </thead>
                                <tbody id="pinTableBody"></tbody>
                            </table>
                        </div>
                    </div>

                    <label>Server URL <span class="req">*</span></label>
                    <input type="text" id="devUrl" placeholder="https://shelly-xxx-eu.shelly.cloud">

                    <label>Cloud Key <span class="req">*</span></label>
                    <input type="text" id="devKey" placeholder="La tua Cloud Key">

                    <label>Device ID <span class="req">*</span></label>
                    <input type="text" id="devId" placeholder="Es. 1x1234567xxx">

                    <button class="btn btn-add" id="btnSave" onclick="salvaDispositivo()">+ Salva Dispositivo</button>
                </div>
            </div>

            <!-- SCHEDA 2: ELENCO CASE -->
            <div id="tab-houses" class="tab-content">
                <div class="card" id="housesCard">
                    <h2>Case Configurate</h2>
                    <div id="housesContainer"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const DEFAULT_PASSWORD = "admin123";

        function ottieniPasswordAdmin() {
            return localStorage.getItem('shelly_admin_pass') || DEFAULT_PASSWORD;
        }

        const currentPins = {};
        const pinVisibility = {};

        function togglePasswordVisibility(inputId, btnId) {
            const passwordInput = document.getElementById(inputId);
            const toggleBtn = document.getElementById(btnId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerText = '👁️';
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            const targetContent = document.getElementById(tabId);
            if (targetContent) targetContent.classList.add('active');

            const activeBtn = Array.from(document.querySelectorAll('.tab-btn')).find(
                btn => btn.getAttribute('onclick').includes(tabId)
            );
            if (activeBtn) activeBtn.classList.add('active');
        }

        function verificaPassword() {
            const input = document.getElementById('adminPassword').value;
            const errDiv = document.getElementById('loginError');

            if (input === ottieniPasswordAdmin()) {
                sessionStorage.setItem('is_admin_authenticated', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                document.getElementById('adminPassword').value = '';
                errDiv.style.display = 'none';
                caricaDispositiviAdmin();
            } else {
                errDiv.style.display = 'block';
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('is_admin_authenticated');
            document.getElementById('adminView').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('adminPassword').value = '';
            document.getElementById('loginError').style.display = 'none';
            
            chiudiModalPass();
            chiudiModalDispositivo();
            chiudiModalCasa();
        }

        function ripristinaPasswordPredefinita() {
            if (confirm("Vuoi ripristinare la password predefinita 'admin123'?")) {
                localStorage.setItem('shelly_admin_pass', DEFAULT_PASSWORD);
                alert("Password ripristinata a: admin123");
            }
        }

        /* GESTIONE POPUP MODIFICA PASSWORD ADMIN */
        function apriModalPass() {
            document.getElementById('currAdminPass').value = '';
            document.getElementById('newAdminPass').value = '';
            document.getElementById('confirmAdminPass').value = '';
            document.getElementById('changePassModal').style.display = 'flex';
        }

        function chiudiModalPass() {
            document.getElementById('changePassModal').style.display = 'none';
        }

        function salvaNuovaPasswordAdmin() {
            const curr = document.getElementById('currAdminPass').value;
            const newP = document.getElementById('newAdminPass').value;
            const conf = document.getElementById('confirmAdminPass').value;

            if (curr !== ottieniPasswordAdmin()) {
                alert("La password attuale non è corretta.");
                return;
            }

            if (!newP) {
                alert("La nuova password non può essere vuota.");
                return;
            }

            if (newP !== conf) {
                alert("La nuova password e la conferma non coincidono.");
                return;
            }

            localStorage.setItem('shelly_admin_pass', newP);
            alert("✔ Password Admin aggiornata con successo!");
            chiudiModalPass();
        }

        function migraDatiEsistenti() {
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            let modificato = false;
            const houseMap = {};

            dispositivi.forEach((dev, index) => {
                const hName = dev.house || "Principale";
                if (!dev.idInternal) {
                    dev.idInternal = 'dev_' + Date.now() + '_' + index;
                    modificato = true;
                }
                if (!dev.houseId) {
                    if (!houseMap[hName]) {
                        houseMap[hName] = 'house_' + Math.random().toString(36).substr(2, 9);
                    }
                    dev.houseId = houseMap[hName];
                    modificato = true;
                } else {
                    houseMap[hName] = dev.houseId;
                }
                if (dev.pin && (!dev.pinList || dev.pinList.length === 0)) {
                    dev.pinList = [{ guest: "Master", pin: dev.pin, isPermanent: true, startDate: "", endDate: "" }];
                    modificato = true;
                }
            });

            if (modificato) {
                localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            migraDatiEsistenti();

            const urlParams = new URLSearchParams(window.location.search);
            const houseIdParam = urlParams.get('houseId');

            if (houseIdParam) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminView').style.display = 'none';
                document.getElementById('guestView').style.display = 'block';

                let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
                let houseDevices = dispositivi.filter(d => d.houseId === houseIdParam);

                if (houseDevices.length > 0) {
                    const houseObj = houseDevices[0];
                    document.getElementById('pageTitle').innerText = houseObj.house;

                    const addressHtml = houseObj.address 
                        ? `<div class="house-address">📍 <a href="https://maps.google.com/?q=${encodeURIComponent(houseObj.address)}" target="_blank">${houseObj.address}</a></div>` 
                        : '';

                    document.getElementById('guestHouseHeader').innerHTML = `
                        <div style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px;">
                            <h2 style="border:none; margin:0; color:#f59e0b;">🏠 ${houseObj.house}</h2>
                            ${addressHtml}
                        </div>
                    `;

                    const container = document.getElementById('guestDevicesList');
                    container.innerHTML = '';
                    houseDevices.forEach((dev, idx) => {
                        container.appendChild(generaElementoDispositivo(dev, idx, true));
                    });
                } else {
                    document.getElementById('guestView').innerHTML = '<p style="text-align:center;">Casa non trovata o rimossa.</p>';
                }
            } else {
                if (sessionStorage.getItem('is_admin_authenticated') === 'true') {
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('adminView').style.display = 'block';
                    caricaDispositiviAdmin();
                } else {
                    document.getElementById('loginOverlay').style.display = 'flex';
                }
            }
        });

        function generaElementoDispositivo(dev, idx, isGuest = false) {
            const item = document.createElement('div');
            item.className = 'device-item';
            const statusId = isGuest ? `gstatus-${idx}` : `status-${idx}`;

            const actionButtons = !isGuest ? `
                <div>
                    <button class="btn-edit" onclick="apriModalDispositivo('${dev.idInternal}')">✏️ Edit</button>
                    <button class="btn-delete" onclick="eliminaDispositivo('${dev.idInternal}')">Elimina</button>
                </div>
            ` : '';

            const titleStyle = isGuest ? 'style="text-align: center; width: 100%;"' : '';

            if (dev.type === 'pin') {
                const pinListData = JSON.stringify(dev.pinList || []).replace(/"/g, '&quot;');
                item.innerHTML = `
                    <div class="device-header">
                        <span class="device-title" ${titleStyle}>🔢 ${dev.name}</span>
                        ${actionButtons}
                    </div>
                    <div class="pin-display-wrapper">
                        <div class="pin-display" id="pin-display-${idx}">••••</div>
                        <button type="button" class="keypad-eye-btn" id="keypad-eye-${idx}" onclick="toggleKeypadPinVisibility(${idx})">👁️</button>
                    </div>
                    <div class="keypad">
                        ${[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(val => `
                            <button class="keypad-btn" onclick="gestisciPinInput('${val}', ${idx}, '${dev.url}', '${dev.id}', '${dev.key}', ${pinListData}, '${statusId}')">${val}</button>
                        `).join('')}
                    </div>
                    <div class="status-msg" id="${statusId}">Inserisci il PIN per aprire</div>
                `;
            } else {
                const btnId = isGuest ? `gbtn-${idx}` : `btn-${idx}`;
                item.innerHTML = `
                    <div class="device-header">
                        <span class="device-title" ${titleStyle}>🔘 ${dev.name}</span>
                        ${actionButtons}
                    </div>
                    <button class="btn btn-trigger" id="${btnId}" onclick="inviaComando('${dev.url}', '${dev.id}', '${dev.key}', '${btnId}', '${statusId}')">
                        APRI
                    </button>
                    <div class="status-msg" id="${statusId}">Premi per aprire</div>
                `;
            }
            return item;
        }

        /* TABELLA PIN - VISTA NUOVO DISPOSITIVO */
        function aggiungiRigaPinTable(guest = '', pin = '', isPermanent = false, startDate = '', endDate = '') {
            const tbody = document.getElementById('pinTableBody');
            tbody.appendChild(creaRigaPinElemento(guest, pin, isPermanent, startDate, endDate));
        }

        /* TABELLA PIN - POPUP MODIFICA */
        function aggiungiRigaPinTableModal(guest = '', pin = '', isPermanent = false, startDate = '', endDate = '') {
            const tbody = document.getElementById('editModalPinTableBody');
            tbody.appendChild(creaRigaPinElemento(guest, pin, isPermanent, startDate, endDate));
        }

        function creaRigaPinElemento(guest = '', pin = '', isPermanent = false, startDate = '', endDate = '') {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="pin-guest" placeholder="Nome" value="${guest}"></td>
                <td><input type="text" class="pin-val" placeholder="4 cifre" maxlength="4" pattern="[0-9]*" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" value="${pin}"></td>
                <td><input type="checkbox" class="pin-perm" ${isPermanent ? 'checked' : ''} onchange="gestisciStatoPermanente(this)"></td>
                <td><input type="date" class="pin-start" value="${startDate}" ${isPermanent ? 'disabled' : 'required'}></td>
                <td><input type="date" class="pin-end" value="${endDate}" ${isPermanent ? 'disabled' : 'required'}></td>
                <td><button type="button" class="btn-delete" style="padding: 6px 8px;" onclick="rimuoviRigaPin(this)">✕</button></td>
            `;
            return tr;
        }

        function gestisciStatoPermanente(checkbox) {
            const tr = checkbox.closest('tr');
            const startInput = tr.querySelector('.pin-start');
            const endInput = tr.querySelector('.pin-end');

            if (checkbox.checked) {
                startInput.value = '';
                endInput.value = '';
                startInput.disabled = true;
                endInput.disabled = true;
                startInput.required = false;
                endInput.required = false;
            } else {
                startInput.disabled = false;
                endInput.disabled = false;
                startInput.required = true;
                endInput.required = true;
            }
        }

        function rimuoviRigaPin(btn) {
            const tr = btn.closest('tr');
            const guestName = tr.querySelector('.pin-guest').value.trim();
            const pinVal = tr.querySelector('.pin-val').value.trim();

            if (!guestName && !pinVal) {
                tr.remove();
                return;
            }

            if (confirm(`Rimuovere il PIN${guestName ? ' di "' + guestName + '"' : ''}?`)) {
                tr.remove();
            }
        }

        function ottieniListaPinDaTabella(targetTbodyId = 'pinTableBody') {
            const righe = document.querySelectorAll(`#${targetTbodyId} tr`);
            const pinList = [];

            for (let i = 0; i < righe.length; i++) {
                const tr = righe[i];
                const guest = tr.querySelector('.pin-guest').value.trim();
                const pin = tr.querySelector('.pin-val').value.trim();
                const isPermanent = tr.querySelector('.pin-perm').checked;
                const startDate = tr.querySelector('.pin-start').value;
                const endDate = tr.querySelector('.pin-end').value;

                if (pin) {
                    if (!/^\d{4}$/.test(pin)) {
                        alert("Tutti i PIN inseriti devono essere di 4 cifre numeriche!");
                        return null;
                    }

                    // VALIDAZIONE OBBLIGATORIETÀ PERMANENTE / DATE
                    if (!isPermanent && (!startDate || !endDate)) {
                        alert(`Per il PIN inserito${guest ? ' (' + guest + ')' : ''}, devi spuntare 'Permanente' OPPURE selezionare sia la data di inizio che quella di fine.`);
                        return null;
                    }

                    if (!isPermanent && startDate > endDate) {
                        alert(`Per il PIN inserito${guest ? ' (' + guest + ')' : ''}, la data d'inizio non può essere successiva alla data di fine.`);
                        return null;
                    }

                    pinList.push({ guest, pin, isPermanent, startDate, endDate });
                }
            }

            return pinList;
        }

        function popolaTabellaPin(pinList = [], targetTbodyId = 'pinTableBody') {
            const tbody = document.getElementById(targetTbodyId);
            tbody.innerHTML = '';
            if (pinList.length === 0) {
                if(targetTbodyId === 'pinTableBody') aggiungiRigaPinTable();
                else aggiungiRigaPinTableModal();
            } else {
                pinList.forEach(p => {
                    if(targetTbodyId === 'pinTableBody') aggiungiRigaPinTable(p.guest, p.pin, !!p.isPermanent, p.startDate, p.endDate);
                    else aggiungiRigaPinTableModal(p.guest, p.pin, !!p.isPermanent, p.startDate, p.endDate);
                });
            }
        }

        function toggleKeypadPinVisibility(index) {
            pinVisibility[index] = !pinVisibility[index];
            const eyeBtn = document.getElementById(`keypad-eye-${index}`);
            if (eyeBtn) eyeBtn.innerText = pinVisibility[index] ? '🙈' : '👁️';
            aggiornaDisplayPin(index);
        }

        function aggiornaDisplayPin(index) {
            const display = document.getElementById(`pin-display-${index}`);
            const currentVal = currentPins[index] || "";
            if (!currentVal) {
                display.innerText = "••••";
            } else {
                display.innerText = pinVisibility[index] ? currentVal : "•".repeat(currentVal.length);
            }
        }

        function gestisciPinInput(val, index, url, id, key, pinList, statusId) {
            if (!currentPins[index]) currentPins[index] = "";
            const statusDiv = document.getElementById(statusId);

            if (val === 'C') {
                currentPins[index] = "";
                aggiornaDisplayPin(index);
                statusDiv.style.color = "#94a3b8";
                statusDiv.innerText = "Inserisci il PIN per aprire";
            } else if (val === 'OK') {
                const pinDigitato = currentPins[index];
                const adesso = new Date();
                adesso.setHours(0, 0, 0, 0);

                const pinValido = pinList.find(p => {
                    if (p.pin !== pinDigitato) return false;
                    if (p.isPermanent) return true;

                    const inizio = p.startDate ? new Date(p.startDate) : null;
                    const fine = p.endDate ? new Date(p.endDate) : null;

                    if (inizio) inizio.setHours(0, 0, 0, 0);
                    if (fine) fine.setHours(23, 59, 59, 999);

                    if (inizio && adesso < inizio) return false;
                    if (fine && adesso > fine) return false;

                    return true;
                });

                if (pinValido) {
                    statusDiv.style.color = "#38bdf8";
                    statusDiv.innerText = "⏳ PIN corretto! Invio comando...";
                    inviaComando(url, id, key, null, statusId);
                } else {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "✖ PIN Scaduto o Errato!";
                }
                currentPins[index] = "";
                aggiornaDisplayPin(index);
            } else {
                if (currentPins[index].length < 4) {
                    currentPins[index] += val;
                    aggiornaDisplayPin(index);
                }
            }
        }

        function inviaComando(serverUrl, deviceId, authKey, btnId, statusId) {
            const btn = btnId ? document.getElementById(btnId) : null;
            const statusDiv = document.getElementById(statusId);

            if (btn) btn.disabled = true;
            statusDiv.style.color = "#38bdf8";
            statusDiv.innerText = "Invio comando...";

            const cleanUrl = serverUrl.replace(/\/$/, "");
            const endpoint = `${cleanUrl}/device/relay/control`;

            const formData = new URLSearchParams();
            formData.append('id', deviceId);
            formData.append('auth_key', authKey);
            formData.append('channel', '0');
            formData.append('turn', 'on');

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.isok) {
                    statusDiv.style.color = "#4ade80";
                    statusDiv.innerText = "✔ Attivato con successo!";
                } else {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "✖ Errore: " + JSON.stringify(data.errors);
                }
            })
            .catch(() => {
                statusDiv.style.color = "#f87171";
                statusDiv.innerText = "✖ Errore di connessione";
            })
            .finally(() => {
                if (btn) setTimeout(() => { btn.disabled = false; }, 3000);
            });
        }

        function caricaDispositiviAdmin() {
            const container = document.getElementById('housesContainer');
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];

            popolaMenuCase(dispositivi);

            if (dispositivi.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Nessuna casa configurata.</p>';
                return;
            }

            const caseGroup = {};
            dispositivi.forEach((dev) => {
                const houseName = dev.house || "Principale";
                if (!caseGroup[houseName]) caseGroup[houseName] = [];
                caseGroup[houseName].push(dev);
            });

            container.innerHTML = '';

            for (const houseName in caseGroup) {
                const houseObj = caseGroup[houseName][0];
                const houseAddress = houseObj.address || "";
                const houseId = houseObj.houseId;

                const addressHtml = houseAddress 
                    ? `<div class="house-address">📍 <a href="https://maps.google.com/?q=${encodeURIComponent(houseAddress)}" target="_blank">${houseAddress}</a></div>` 
                    : '';

                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder-card';
                folderDiv.innerHTML = `
                    <div class="folder-header" onclick="this.parentElement.classList.toggle('open')">
                        <div class="folder-title">🏠 ${houseName}</div>
                        <span style="font-size: 12px; color: #94a3b8;">▼</span>
                    </div>
                    <div class="folder-content">
                        ${addressHtml}
                        <div class="house-actions-row">
                            <button class="btn-house-action btn-house-share" onclick="copiaLinkCasa('${houseId}')">🔗 Copia Link</button>
                            <button class="btn-house-action btn-house-regen" onclick="rigeneraLinkCasa('${houseId}', '${houseName.replace(/'/g, "\\'")}')">🔄 Rigenera Link</button>
                            <button class="btn-house-action btn-house-rename" onclick="apriModalCasa('${houseId}', '${houseName.replace(/'/g, "\\'")}', '${houseAddress.replace(/'/g, "\\'")}')">✏️ Modifica Casa</button>
                            <button class="btn-house-action btn-house-delete" onclick="eliminaInteraCasa('${houseId}', '${houseName.replace(/'/g, "\\'")}')">🗑️ Elimina</button>
                        </div>
                        <div id="dev-list-${houseId}"></div>
                    </div>
                `;

                const devListContainer = folderDiv.querySelector(`#dev-list-${houseId}`);
                caseGroup[houseName].forEach((dev, idx) => {
                    devListContainer.appendChild(generaElementoDispositivo(dev, idx, false));
                });

                container.appendChild(folderDiv);
            }
        }

        function popolaMenuCase(dispositivi) {
            const select = document.getElementById('devHouseSelect');
            const modalSelect = document.getElementById('editModalHouseSelect');
            const caseUniche = [...new Set(dispositivi.map(d => d.house || "Principale"))];

            select.innerHTML = '';
            modalSelect.innerHTML = '';

            caseUniche.forEach(casa => {
                const opt = document.createElement('option');
                opt.value = casa;
                opt.innerText = casa;
                select.appendChild(opt);

                const optModal = document.createElement('option');
                optModal.value = casa;
                optModal.innerText = casa;
                modalSelect.appendChild(optModal);
            });

            const optNew = document.createElement('option');
            optNew.value = "NEW_HOUSE";
            optNew.innerText = "➕ Nuova cartella / casa...";
            select.appendChild(optNew);

            gestisciSelezioneCasa();
        }

        function gestisciSelezioneCasa() {
            const select = document.getElementById('devHouseSelect');
            const newHouseContainer = document.getElementById('newHouseContainer');
            newHouseContainer.style.display = select.value === "NEW_HOUSE" ? "block" : "none";
        }

        function gestisciTipoAccesso() {
            const type = document.getElementById('devType').value;
            const pinContainer = document.getElementById('pinContainer');
            pinContainer.style.display = type === 'pin' ? 'block' : 'none';
            if (type === 'pin' && document.querySelectorAll('#pinTableBody tr').length === 0) {
                aggiungiRigaPinTable();
            }
        }

        function gestisciTipoAccessoModal() {
            const type = document.getElementById('editModalType').value;
            const pinContainer = document.getElementById('editModalPinContainer');
            pinContainer.style.display = type === 'pin' ? 'block' : 'none';
            if (type === 'pin' && document.querySelectorAll('#editModalPinTableBody tr').length === 0) {
                aggiungiRigaPinTableModal();
            }
        }

        function copiaLinkCasa(houseId) {
            if(!houseId || houseId === 'undefined') {
                alert("Errore nell'ID della casa.");
                return;
            }

            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const fullUrl = `${baseUrl}?houseId=${houseId}`;

            navigator.clipboard.writeText(fullUrl).then(() => {
                alert(`✔ Link PERMANENTE copiato negli appunti!\n\nLink: ${fullUrl}`);
            }).catch(() => {
                prompt("Copia manualmente il link permanente:", fullUrl);
            });
        }

        function rigeneraLinkCasa(houseId, houseName) {
            if (!confirm(`Sei sicuro di voler rigenerare il link per "${houseName}"?\n\n⚠️ Il vecchio link inviato agli ospiti smetterà immediatamente di funzionare.`)) {
                return;
            }

            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            const nuovoHouseId = 'house_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

            dispositivi.forEach(dev => {
                if (dev.houseId === houseId) {
                    dev.houseId = nuovoHouseId;
                }
            });

            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            caricaDispositiviAdmin();

            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const nuovoUrl = `${baseUrl}?houseId=${nuovoHouseId}`;

            navigator.clipboard.writeText(nuovoUrl).then(() => {
                alert(`✔ Link rigenerato con successo e COPIATO negli appunti!\n\nIl vecchio link non funziona più.\nNuovo Link: ${nuovoUrl}`);
            }).catch(() => {
                prompt("✔ Link rigenerato con successo! Il vecchio link è disattivato.\nCopia manualmente il nuovo link:", nuovoUrl);
            });
        }

        /* POPUP MODIFICA CASA */
        function apriModalCasa(houseId, vecchioNome, vecchioIndirizzo) {
            document.getElementById('editHouseModalId').value = houseId;
            document.getElementById('editHouseModalName').value = vecchioNome;
            document.getElementById('editHouseModalAddress').value = vecchioIndirizzo;
            document.getElementById('editHouseModal').style.display = 'flex';
        }

        function chiudiModalCasa() {
            document.getElementById('editHouseModal').style.display = 'none';
        }

        function salvaModificaCasaModal() {
            const houseId = document.getElementById('editHouseModalId').value;
            const nuovoNome = document.getElementById('editHouseModalName').value.trim();
            const nuovoIndirizzo = document.getElementById('editHouseModalAddress').value.trim();

            if (!nuovoNome) {
                alert("Inserisci un nome per la casa.");
                return;
            }

            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            dispositivi.forEach(dev => {
                if (dev.houseId === houseId) {
                    dev.house = nuovoNome;
                    dev.address = nuovoIndirizzo;
                }
            });

            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            chiudiModalCasa();
            caricaDispositiviAdmin();
        }

        /* POPUP MODIFICA DISPOSITIVO */
        function apriModalDispositivo(idInternal) {
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            const dev = dispositivi.find(d => d.idInternal === idInternal);

            if (!dev) return;

            document.getElementById('editModalDevId').value = dev.idInternal;
            document.getElementById('editModalHouseSelect').value = dev.house;
            document.getElementById('editModalName').value = dev.name;
            document.getElementById('editModalType').value = dev.type;
            
            gestisciTipoAccessoModal();
            popolaTabellaPin(dev.pinList || [], 'editModalPinTableBody');

            document.getElementById('editModalUrl').value = dev.url;
            document.getElementById('editModalKey').value = dev.key;
            document.getElementById('editModalId').value = dev.id;

            document.getElementById('editDeviceModal').style.display = 'flex';
        }

        function chiudiModalDispositivo() {
            document.getElementById('editDeviceModal').style.display = 'none';
        }

        function salvaModificheModal() {
            const editingId = document.getElementById('editModalDevId').value;
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];

            const house = document.getElementById('editModalHouseSelect').value;
            const devEsistente = dispositivi.find(d => d.house === house);
            const address = devEsistente ? (devEsistente.address || "") : "";
            const houseId = devEsistente && devEsistente.houseId ? devEsistente.houseId : ('house_' + Date.now());

            const name = document.getElementById('editModalName').value.trim();
            const type = document.getElementById('editModalType').value;
            const pinList = type === 'pin' ? ottieniListaPinDaTabella('editModalPinTableBody') : [];
            
            if (type === 'pin' && pinList === null) return;

            const url  = document.getElementById('editModalUrl').value.trim().replace(/\/$/, "");
            const key  = document.getElementById('editModalKey').value.trim();
            const id   = document.getElementById('editModalId').value.trim();

            if (!house || !name || !url || !key || !id) {
                alert("Compila tutti i campi obbligatori!");
                return;
            }

            if (type === 'pin' && pinList.length === 0) {
                alert("Inserisci almeno un PIN valido nella tabella!");
                return;
            }

            const index = dispositivi.findIndex(d => d.idInternal === editingId);
            if (index !== -1) {
                dispositivi[index] = { 
                    ...dispositivi[index], 
                    house, 
                    address, 
                    houseId,
                    name, 
                    type, 
                    pinList, 
                    url, 
                    key, 
                    id 
                };
            }

            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            chiudiModalDispositivo();
            caricaDispositiviAdmin();
        }

        function salvaDispositivo() {
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            const select = document.getElementById('devHouseSelect');

            let house = "";
            let address = "";
            let houseId = "";

            if (select.value === "NEW_HOUSE") {
                house = document.getElementById('devNewHouse').value.trim();
                address = document.getElementById('devHouseAddress').value.trim();
                houseId = 'house_' + Date.now();
            } else {
                house = select.value;
                const devEsistente = dispositivi.find(d => d.house === house);
                address = devEsistente ? (devEsistente.address || "") : "";
                houseId = devEsistente && devEsistente.houseId ? devEsistente.houseId : ('house_' + Date.now());
            }

            const name = document.getElementById('devName').value.trim();
            const type = document.getElementById('devType').value;
            const pinList = type === 'pin' ? ottieniListaPinDaTabella('pinTableBody') : [];
            
            if (type === 'pin' && pinList === null) return;

            const url  = document.getElementById('devUrl').value.trim().replace(/\/$/, "");
            const key  = document.getElementById('devKey').value.trim();
            const id   = document.getElementById('devId').value.trim();

            if (!house || !name || !url || !key || !id) {
                alert("Compila tutti i campi obbligatori!");
                return;
            }

            if (type === 'pin' && pinList.length === 0) {
                alert("Inserisci almeno un PIN valido nella tabella!");
                return;
            }

            const idInternal = 'dev_' + Date.now();
            dispositivi.push({ idInternal, houseId, house, address, name, type, pinList, url, key, id });

            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            resetForm();
            caricaDispositiviAdmin();
            switchTab('tab-houses');
        }

        function resetForm() {
            document.getElementById('devNewHouse').value = '';
            document.getElementById('devHouseAddress').value = '';
            document.getElementById('devName').value = '';
            popolaTabellaPin([], 'pinTableBody');
            document.getElementById('devUrl').value = '';
            document.getElementById('devKey').value = '';
            document.getElementById('devId').value = '';
            document.getElementById('devType').value = 'button';
            gestisciTipoAccesso();
        }

        function eliminaInteraCasa(houseId, houseName) {
            if (!confirm(`Eliminare la casa "${houseName}" e tutti i suoi dispositivi?`)) return;
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            dispositivi = dispositivi.filter(d => d.houseId !== houseId && d.house !== houseName);
            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            caricaDispositiviAdmin();
        }

        function eliminaDispositivo(idInternal) {
            if (!confirm("Sei sicuro di voler eliminare questo dispositivo?")) return;
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            dispositivi = dispositivi.filter(d => d.idInternal !== idInternal);
            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            caricaDispositiviAdmin();
        }
    </script>
</body>
