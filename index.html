<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Shelly Remote</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 680px; width: 100%; } /* Allargata la vista generale da 480px a 680px */
        h1 { text-align: center; color: #f8fafc; font-size: 22px; margin-bottom: 20px; }
        h2 { font-size: 16px; margin-bottom: 15px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-top: 0; }
        
        .folder-card { background-color: #1e293b; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; overflow: hidden; }
        .folder-header { background-color: #334155; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .folder-header:hover { background-color: #475569; }
        .folder-title { font-size: 16px; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        .folder-content { padding: 16px; display: none; }
        .folder-card.open .folder-content { display: block; }
        .folder-card.open .folder-header { background-color: #1e293b; border-bottom: 1px solid #334155; }
        
        .house-address { font-size: 13px; color: #94a3b8; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
        .house-address a { color: #38bdf8; text-decoration: none; }
        
        .card { background-color: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #94a3b8; text-transform: uppercase; }
        .req { color: #ef4444; font-weight: bold; }
        
        input, select { width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        
        /* TABELLA PIN OSPITI INGRANDITA */
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 15px; border-radius: 8px; border: 1px solid #334155; }
        .pin-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 500px; }
        .pin-table th { text-align: center; background-color: #0f172a; color: #38bdf8; padding: 10px; border: 1px solid #334155; }
        .pin-table td { padding: 8px; border: 1px solid #334155; background-color: #1e293b; text-align: center; }
        .pin-table input[type="text"], .pin-table input[type="date"] { margin-bottom: 0; padding: 8px 10px; font-size: 13px; }
        .pin-table input[type="checkbox"] { width: 18px; height: 18px; margin: 0; cursor: pointer; accent-color: #38bdf8; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-add { background-color: #10b981; color: white; margin-top: 5px; }
        .btn-edit { background-color: #f59e0b; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .btn-house-action { color: white; border: none; padding: 8px 10px; font-size: 11px; border-radius: 6px; cursor: pointer; flex: 1; }
        .btn-house-share { background-color: #8b5cf6; }
        .btn-house-rename { background-color: #f59e0b; }
        .btn-house-delete { background-color: #dc2626; }
        .house-actions-row { display: flex; gap: 6px; margin-bottom: 15px; }
        .btn-small-add { background-color: #3b82f6; color: white; border: none; padding: 8px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; margin-bottom: 12px; font-weight: bold; }
        
        .device-item { background-color: #0f172a; padding: 16px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .device-title { font-weight: bold; font-size: 16px; color: #f1f5f9; }
        .btn-trigger { background-color: #2563eb; color: white; padding: 14px; font-size: 16px; }
        .btn-trigger:disabled { background-color: #64748b; cursor: not-allowed; }
        .status-msg { font-size: 13px; text-align: center; margin-top: 8px; min-height: 18px; color: #94a3b8; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .keypad-btn { background-color: #334155; color: white; font-size: 20px; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .keypad-btn:active { background-color: #38bdf8; }
        .pin-display-wrapper { position: relative; }
        .pin-display { text-align: center; font-size: 24px; letter-spacing: 8px; margin-bottom: 10px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; min-height: 48px; }
        .keypad-eye-btn { position: absolute; right: 12px; top: 12px; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; user-select: none; }

        /* MODALE LOGIN */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .login-card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 360px; border: 1px solid #334155; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-card h2 { border: none; margin-bottom: 20px; }
        .login-err { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }
    </style>
</head>
<body>

    <!-- OVERLAY LOGIN -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h2>🔒 Accesso Riservato</h2>
            <label for="adminPassword" style="text-align: left;">Inserisci Password Admin <span class="req">*</span></label>
            <input type="password" id="adminPassword" placeholder="••••••••" onkeyup="if(event.key==='Enter') verificaPassword()">
            <button class="btn btn-add" onclick="verificaPassword()">Accedi</button>
            <div id="loginError" class="login-err">Password errata! Riprova.</div>
        </div>
    </div>

    <div class="container">
        <h1 id="pageTitle">Controllo Shelly Remote</h1>

        <!-- VISTA OSPITE -->
        <div id="guestView" class="card" style="display: none;">
            <div id="guestHouseHeader"></div>
            <div id="guestDevicesList"></div>
        </div>

        <!-- VISTA AMMINISTRATORE -->
        <div id="adminView" style="display: none;">
            <div class="card" id="housesCard">
                <h2>Cartelle Appartamenti</h2>
                <div id="housesContainer"></div>
            </div>

            <div class="card" id="formCard">
                <h2 id="formTitle">Aggiungi Nuovo Dispositivo</h2>
                <input type="hidden" id="editingDevId" value="">
                
                <label>Seleziona Casa / Cartella <span class="req">*</span></label>
                <select id="devHouseSelect" onchange="gestisciSelezioneCasa()"></select>

                <div id="newHouseContainer" style="display: none;">
                    <label>Nome Nuova Casa <span class="req">*</span></label>
                    <input type="text" id="devNewHouse" placeholder="es. Appartamento mare, Appartemento città">
                    
                    <label>Indirizzo della Casa</label>
                    <input type="text" id="devHouseAddress" placeholder="es. Via Roma 123, Palermo">
                </div>

                <label>Nome Pulsante / Comando <span class="req">*</span></label>
                <input type="text" id="devName" placeholder="es. Portone, Porta di ingresso, Atrio">

                <label>Tipo Accesso <span class="req">*</span></label>
                <select id="devType" onchange="gestisciTipoAccesso()">
                    <option value="button">🏢 Portone palazzo (Tasto Diretto)</option>
                    <option value="pin">🔑 Porta appartamento (Tastierino PIN)</option>
                </select>

                <div id="pinContainer" style="display: none;">
                    <label>Tabella Gestione PIN Ospiti <span class="req">*</span></label>
                    <button type="button" class="btn-small-add" onclick="aggiungiRigaPinTable()">+ Aggiungi PIN ospite</button>
                    
                    <div class="table-responsive">
                        <table class="pin-table">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">Nome Ospite</th>
                                    <th style="width: 20%;">PIN <span class="req">*</span></th>
                                    <th style="width: 10%;">Perm.</th>
                                    <th style="width: 20%;">Dal</th>
                                    <th style="width: 20%;">Al</th>
                                    <th style="width: 5%;"></th>
                                </tr>
                            </thead>
                            <tbody id="pinTableBody">
                                <!-- Righe create dinamicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <label>Server URL <span class="req">*</span></label>
                <input type="text" id="devUrl" placeholder="https://shelly-xxx-eu.shelly.cloud">

                <label>Cloud Key <span class="req">*</span></label>
                <input type="text" id="devKey" placeholder="La tua Cloud Key">

                <label>Device ID <span class="req">*</span></label>
                <input type="text" id="devId" placeholder="Es. 1x1234567xxx">

                <button class="btn btn-add" id="btnSave" onclick="salvaDispositivo()">+ Salva Dispositivo</button>
                <button class="btn" id="btnCancel" onclick="resetForm()" style="display:none; background-color: #64748b; margin-top: 8px;">Annulla Modifica</button>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD_ADMIN = "admin123";

        const currentPins = {};
        const pinVisibility = {};

        function verificaPassword() {
            const input = document.getElementById('adminPassword').value;
            const errDiv = document.getElementById('loginError');

            if (input === PASSWORD_ADMIN) {
                sessionStorage.setItem('is_admin_authenticated', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                caricaDispositiviAdmin();
            } else {
                errDiv.style.display = 'block';
            }
        }

        function migraDatiEsistenti() {
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            let modificato = false;
            const houseMap = {};

            dispositivi.forEach((dev, index) => {
                const hName = dev.house || "Principale";
                if (!dev.idInternal) {
                    dev.idInternal = 'dev_' + Date.now() + '_' + index;
                    modificato = true;
                }
                if (!dev.houseId) {
                    if (!houseMap[hName]) {
                        houseMap[hName] = 'house_' + Math.random().toString(36).substr(2, 9);
                    }
                    dev.houseId = houseMap[hName];
                    modificato = true;
                } else {
                    houseMap[hName] = dev.houseId;
                }
                if (dev.pin && (!dev.pinList || dev.pinList.length === 0)) {
                    dev.pinList = [{ guest: "Master", pin: dev.pin, isPermanent: true, startDate: "", endDate: "" }];
                    modificato = true;
                }
            });

            if (modificato) {
                localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            migraDatiEsistenti();

            const urlParams = new URLSearchParams(window.location.search);
            const houseIdParam = urlParams.get('houseId');

            if (houseIdParam) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminView').style.display = 'none';
                document.getElementById('guestView').style.display = 'block';

                let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
                let houseDevices = dispositivi.filter(d => d.houseId === houseIdParam);

                if (houseDevices.length > 0) {
                    const houseObj = houseDevices[0];
                    document.getElementById('pageTitle').innerText = houseObj.house;

                    const addressHtml = houseObj.address 
                        ? `<div class="house-address">📍 <a href="https://maps.google.com/?q=${encodeURIComponent(houseObj.address)}" target="_blank">${houseObj.address}</a></div>` 
                        : '';

                    document.getElementById('guestHouseHeader').innerHTML = `
                        <div style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px;">
                            <h2 style="border:none; margin:0; color:#f59e0b;">🏠 ${houseObj.house}</h2>
                            ${addressHtml}
                        </div>
                    `;

                    const container = document.getElementById('guestDevicesList');
                    container.innerHTML = '';
                    houseDevices.forEach((dev, idx) => {
                        container.appendChild(generaElementoDispositivo(dev, idx, true));
                    });
                } else {
                    document.getElementById('guestView').innerHTML = '<p style="text-align:center;">Appartamento non trovato o rimosso.</p>';
                }
            } else {
                if (sessionStorage.getItem('is_admin_authenticated') === 'true') {
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('adminView').style.display = 'block';
                    caricaDispositiviAdmin();
                } else {
                    document.getElementById('loginOverlay').style.display = 'flex';
                }
            }
        });

        function generaElementoDispositivo(dev, idx, isGuest = false) {
            const item = document.createElement('div');
            item.className = 'device-item';
            const statusId = isGuest ? `gstatus-${idx}` : `status-${idx}`;

            const actionButtons = !isGuest ? `
                <div>
                    <button class="btn-edit" onclick="caricaInModifica('${dev.idInternal}')">✏️ Edit</button>
                    <button class="btn-delete" onclick="eliminaDispositivo('${dev.idInternal}')">Elimina</button>
                </div>
            ` : '';

            if (dev.type === 'pin') {
                const pinListData = JSON.stringify(dev.pinList || []).replace(/"/g, '&quot;');
                item.innerHTML = `
                    <div class="device-header">
                        <span class="device-title">🔑 ${dev.name}</span>
                        ${actionButtons}
                    </div>
                    <div class="pin-display-wrapper">
                        <div class="pin-display" id="pin-display-${idx}">••••</div>
                        <button type="button" class="keypad-eye-btn" id="keypad-eye-${idx}" onclick="toggleKeypadPinVisibility(${idx})">👁️</button>
                    </div>
                    <div class="keypad">
                        ${[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(val => `
                            <button class="keypad-btn" onclick="gestisciPinInput('${val}', ${idx}, '${dev.url}', '${dev.id}', '${dev.key}', ${pinListData}, '${statusId}')">${val}</button>
                        `).join('')}
                    </div>
                    <div class="status-msg" id="${statusId}">Inserisci il PIN per aprire</div>
                `;
            } else {
                const btnId = isGuest ? `gbtn-${idx}` : `btn-${idx}`;
                item.innerHTML = `
                    <div class="device-header">
                        <span class="device-title">🏢 ${dev.name}</span>
                        ${actionButtons}
                    </div>
                    <button class="btn btn-trigger" id="${btnId}" onclick="inviaComando('${dev.url}', '${dev.id}', '${dev.key}', '${btnId}', '${statusId}')">
                        ${isGuest ? 'ATTIVA PORTONE' : 'APRI'}
                    </button>
                    <div class="status-msg" id="${statusId}">Premi per aprire</div>
                `;
            }
            return item;
        }

        function aggiungiRigaPinTable(guest = '', pin = '', isPermanent = false, startDate = '', endDate = '') {
            const tbody = document.getElementById('pinTableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="pin-guest" placeholder="Nome" value="${guest}"></td>
                <td><input type="text" class="pin-val" placeholder="PIN" maxlength="6" value="${pin}"></td>
                <td><input type="checkbox" class="pin-perm" ${isPermanent ? 'checked' : ''} onchange="gestisciStatoPermanente(this)"></td>
                <td><input type="date" class="pin-start" value="${startDate}" ${isPermanent ? 'disabled' : ''}></td>
                <td><input type="date" class="pin-end" value="${endDate}" ${isPermanent ? 'disabled' : ''}></td>
                <td><button type="button" class="btn-delete" style="padding: 6px 8px;" onclick="rimuoviRigaPin(this)">✕</button></td>
            `;
            tbody.appendChild(tr);
        }

        function gestisciStatoPermanente(checkbox) {
            const tr = checkbox.closest('tr');
            const startInput = tr.querySelector('.pin-start');
            const endInput = tr.querySelector('.pin-end');

            if (checkbox.checked) {
                startInput.value = '';
                endInput.value = '';
                startInput.disabled = true;
                endInput.disabled = true;
            } else {
                startInput.disabled = false;
                endInput.disabled = false;
            }
        }

        function rimuoviRigaPin(btn) {
            const tr = btn.closest('tr');
            const guestName = tr.querySelector('.pin-guest').value.trim();
            const pinVal = tr.querySelector('.pin-val').value.trim();
            const startDate = tr.querySelector('.pin-start').value;
            const endDate = tr.querySelector('.pin-end').value;

            // Se tutti i campi (Nome, PIN, Dal e Al) sono vuoti, rimuovi direttamente senza chiedere conferma
            if (!guestName && !pinVal && !startDate && !endDate) {
                tr.remove();
                return;
            }

            // Altrimenti chiedi conferma mostrandone i dettagli
            let messaggio = `Sei sicuro di voler eliminare il PIN${guestName ? ' di "' + guestName + '"' : ''}${pinVal ? ' (' + pinVal + ')' : ''}?`;
            if (confirm(messaggio)) {
                tr.remove();
            }
        }

        function ottieniListaPinDaTabella() {
            const righe = document.querySelectorAll('#pinTableBody tr');
            const pinList = [];
            righe.forEach(tr => {
                const guest = tr.querySelector('.pin-guest').value.trim();
                const pin = tr.querySelector('.pin-val').value.trim();
                const isPermanent = tr.querySelector('.pin-perm').checked;
                const startDate = tr.querySelector('.pin-start').value;
                const endDate = tr.querySelector('.pin-end').value;

                if (pin) {
                    pinList.push({ guest, pin, isPermanent, startDate, endDate });
                }
            });
            return pinList;
        }

        function popolaTabellaPin(pinList = []) {
            const tbody = document.getElementById('pinTableBody');
            tbody.innerHTML = '';
            if (pinList.length === 0) {
                aggiungiRigaPinTable();
            } else {
                pinList.forEach(p => aggiungiRigaPinTable(p.guest, p.pin, !!p.isPermanent, p.startDate, p.endDate));
            }
        }

        function toggleKeypadPinVisibility(index) {
            pinVisibility[index] = !pinVisibility[index];
            const eyeBtn = document.getElementById(`keypad-eye-${index}`);
            if (eyeBtn) {
                eyeBtn.innerText = pinVisibility[index] ? '🙈' : '👁️';
            }
            aggiornaDisplayPin(index);
        }

        function aggiornaDisplayPin(index) {
            const display = document.getElementById(`pin-display-${index}`);
            const currentVal = currentPins[index] || "";
            if (!currentVal) {
                display.innerText = "••••";
            } else {
                display.innerText = pinVisibility[index] ? currentVal : "•".repeat(currentVal.length);
            }
        }

        function gestisciPinInput(val, index, url, id, key, pinList, statusId) {
            if (!currentPins[index]) currentPins[index] = "";
            const statusDiv = document.getElementById(statusId);

            if (val === 'C') {
                currentPins[index] = "";
                aggiornaDisplayPin(index);
                statusDiv.innerText = "Inserisci il PIN per aprire";
            } else if (val === 'OK') {
                const pinDigitato = currentPins[index];
                const adesso = new Date();
                adesso.setHours(0, 0, 0, 0);

                const pinValido = pinList.find(p => {
                    if (p.pin !== pinDigitato) return false;
                    if (p.isPermanent) return true;

                    const inizio = p.startDate ? new Date(p.startDate) : null;
                    const fine = p.endDate ? new Date(p.endDate) : null;

                    if (inizio) inizio.setHours(0, 0, 0, 0);
                    if (fine) fine.setHours(23, 59, 59, 999);

                    if (inizio && adesso < inizio) return false;
                    if (fine && adesso > fine) return false;

                    return true;
                });

                if (pinValido) {
                    inviaComando(url, id, key, null, statusId);
                } else {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "✖ PIN Scaduto o Errato!";
                }
                currentPins[index] = "";
                aggiornaDisplayPin(index);
            } else {
                if (currentPins[index].length < 6) {
                    currentPins[index] += val;
                    aggiornaDisplayPin(index);
                }
            }
        }

        function inviaComando(serverUrl, deviceId, authKey, btnId, statusId) {
            const btn = btnId ? document.getElementById(btnId) : null;
            const statusDiv = document.getElementById(statusId);

            if (btn) btn.disabled = true;
            statusDiv.style.color = "#38bdf8";
            statusDiv.innerText = "Invio comando...";

            const cleanUrl = serverUrl.replace(/\/$/, "");
            const endpoint = `${cleanUrl}/device/relay/control`;

            const formData = new URLSearchParams();
            formData.append('id', deviceId);
            formData.append('auth_key', authKey);
            formData.append('channel', '0');
            formData.append('turn', 'on');

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.isok) {
                    statusDiv.style.color = "#4ade80";
                    statusDiv.innerText = "✔ Attivato con successo!";
                } else {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "✖ Errore: " + JSON.stringify(data.errors);
                }
            })
            .catch(() => {
                statusDiv.style.color = "#f87171";
                statusDiv.innerText = "✖ Errore di connessione";
            })
            .finally(() => {
                if (btn) setTimeout(() => { btn.disabled = false; }, 3000);
            });
        }

        function caricaDispositiviAdmin() {
            const container = document.getElementById('housesContainer');
            const housesCard = document.getElementById('housesCard');
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];

            popolaMenuCase(dispositivi);

            if (dispositivi.length === 0) {
                if (housesCard) housesCard.style.display = 'none';
                container.innerHTML = '';
                return;
            }

            if (housesCard) housesCard.style.display = 'block';

            const caseGroup = {};
            dispositivi.forEach((dev) => {
                const houseName = dev.house || "Principale";
                if (!caseGroup[houseName]) caseGroup[houseName] = [];
                caseGroup[houseName].push(dev);
            });

            container.innerHTML = '';

            for (const houseName in caseGroup) {
                const houseObj = caseGroup[houseName][0];
                const houseAddress = houseObj.address || "";
                const houseId = houseObj.houseId;

                const addressHtml = houseAddress 
                    ? `<div class="house-address">📍 <a href="https://maps.google.com/?q=${encodeURIComponent(houseAddress)}" target="_blank">${houseAddress}</a></div>` 
                    : '';

                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder-card';
                folderDiv.innerHTML = `
                    <div class="folder-header" onclick="this.parentElement.classList.toggle('open')">
                        <div class="folder-title">📁 ${houseName}</div>
                        <span style="font-size: 12px; color: #94a3b8;">▼</span>
                    </div>
                    <div class="folder-content">
                        ${addressHtml}
                        <div class="house-actions-row">
                            <button class="btn-house-action btn-house-share" onclick="copiaLinkCasa('${houseId}')">🔗 Copia Link</button>
                            <button class="btn-house-action btn-house-rename" onclick="modificaInteraCasa('${houseId}', '${houseName.replace(/'/g, "\\'")}', '${houseAddress.replace(/'/g, "\\'")}')">✏️ Modifica Casa</button>
                            <button class="btn-house-action btn-house-delete" onclick="eliminaInteroAppartamento('${houseId}', '${houseName.replace(/'/g, "\\'")}')">🗑️ Elimina</button>
                        </div>
                        <div id="dev-list-${houseId}"></div>
                    </div>
                `;

                const devListContainer = folderDiv.querySelector(`#dev-list-${houseId}`);
                caseGroup[houseName].forEach((dev, idx) => {
                    devListContainer.appendChild(generaElementoDispositivo(dev, idx, false));
                });

                container.appendChild(folderDiv);
            }
        }

        function popolaMenuCase(dispositivi) {
            const select = document.getElementById('devHouseSelect');
            const caseUniche = [...new Set(dispositivi.map(d => d.house || "Principale"))];

            select.innerHTML = '';
            caseUniche.forEach(casa => {
                const opt = document.createElement('option');
                opt.value = casa;
                opt.innerText = casa;
                select.appendChild(opt);
            });

            const optNew = document.createElement('option');
            optNew.value = "NEW_HOUSE";
            optNew.innerText = "➕ Nuova cartella / casa...";
            select.appendChild(optNew);

            gestisciSelezioneCasa();
        }

        function gestisciSelezioneCasa() {
            const select = document.getElementById('devHouseSelect');
            const newHouseContainer = document.getElementById('newHouseContainer');
            newHouseContainer.style.display = select.value === "NEW_HOUSE" ? "block" : "none";
        }

        function gestisciTipoAccesso() {
            const type = document.getElementById('devType').value;
            const pinContainer = document.getElementById('pinContainer');
            pinContainer.style.display = type === 'pin' ? 'block' : 'none';
            if (type === 'pin' && document.querySelectorAll('#pinTableBody tr').length === 0) {
                aggiungiRigaPinTable();
            }
        }

        function copiaLinkCasa(houseId) {
            if(!houseId || houseId === 'undefined') {
                alert("Errore nell'ID della casa. Prova a salvare di nuovo la casa.");
                return;
            }

            const baseUrl = window.location.href.split('?')[0];
            const fullUrl = `${baseUrl}?houseId=${houseId}`;

            navigator.clipboard.writeText(fullUrl).then(() => {
                alert(`✔ Link PERMANENTE copiato negli appunti!\n\nLink: ${fullUrl}`);
            }).catch(() => {
                prompt("Copia manualmente il link permanente:", fullUrl);
            });
        }

        function modificaInteraCasa(houseId, vecchioNome, vecchioIndirizzo) {
            const nuovoNome = prompt(`Modifica nome dell'appartamento:`, vecchioNome);
            if (nuovoNome === null) return;

            const nuovoIndirizzo = prompt(`Modifica indirizzo dell'appartamento:`, vecchioIndirizzo);
            if (nuovoIndirizzo === null) return;

            const nomePulito = nuovoNome.trim() || vecchioNome;
            const indirizzoPulito = nuovoIndirizzo.trim();

            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];

            dispositivi.forEach(dev => {
                if (dev.houseId === houseId || dev.house === vecchioNome) {
                    dev.house = nomePulito;
                    dev.address = indirizzoPulito;
                }
            });

            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            resetForm();
            caricaDispositiviAdmin();
        }

        function eliminaInteroAppartamento(houseId, houseName) {
            const risposta = confirm(`Sei sicuro di voler eliminare interamente l'appartamento "${houseName}"?\n\nQuesta azione rimuoverà tutti i dispositivi, comandi e PIN configurati per questo appartamento.`);
            if (!risposta) return;

            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            dispositivi = dispositivi.filter(d => d.houseId !== houseId && d.house !== houseName);
            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));

            resetForm();
            caricaDispositiviAdmin();
        }

        function salvaDispositivo() {
            const editingId = document.getElementById('editingDevId').value;
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];

            const select = document.getElementById('devHouseSelect');
            let house = "";
            let address = "";
            let houseId = "";

            if (select.value === "NEW_HOUSE") {
                house = document.getElementById('devNewHouse').value.trim();
                address = document.getElementById('devHouseAddress').value.trim();
                houseId = 'house_' + Date.now();
            } else {
                house = select.value;
                const devEsistente = dispositivi.find(d => d.house === house);
                address = devEsistente ? (devEsistente.address || "") : "";
                houseId = devEsistente && devEsistente.houseId ? devEsistente.houseId : ('house_' + Date.now());
            }

            const name = document.getElementById('devName').value.trim();
            const type = document.getElementById('devType').value;
            const pinList = type === 'pin' ? ottieniListaPinDaTabella() : [];
            const url  = document.getElementById('devUrl').value.trim().replace(/\/$/, "");
            const key  = document.getElementById('devKey').value.trim();
            const id   = document.getElementById('devId').value.trim();

            if (!house || !name || !url || !key || !id) {
                alert("Compila tutti i campi obbligatori!");
                return;
            }

            if (type === 'pin' && pinList.length === 0) {
                alert("Inserisci almeno un PIN valido nella tabella!");
                return;
            }

            if (editingId) {
                const index = dispositivi.findIndex(d => d.idInternal === editingId);
                if (index !== -1) {
                    dispositivi[index] = { 
                        ...dispositivi[index], 
                        house, 
                        address, 
                        houseId,
                        name, 
                        type, 
                        pinList, 
                        url, 
                        key, 
                        id 
                    };
                    
                    dispositivi.forEach(d => {
                        if(d.house === house) {
                            d.address = address;
                            d.houseId = houseId;
                        }
                    });
                }
            } else {
                const idInternal = 'dev_' + Date.now();
                dispositivi.push({ idInternal, houseId, house, address, name, type, pinList, url, key, id });
            }

            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            resetForm();
            caricaDispositiviAdmin();
        }

        function caricaInModifica(idInternal) {
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            const dev = dispositivi.find(d => d.idInternal === idInternal);

            if (!dev) return;

            document.getElementById('editingDevId').value = dev.idInternal;
            document.getElementById('formTitle').innerText = "✏️ Modifica Dispositivo";
            document.getElementById('btnSave').innerText = "Salva Modifiche";
            document.getElementById('btnCancel').style.display = "block";

            document.getElementById('devHouseSelect').value = dev.house;
            gestisciSelezioneCasa();

            document.getElementById('devName').value = dev.name;
            document.getElementById('devType').value = dev.type;
            gestisciTipoAccesso();

            popolaTabellaPin(dev.pinList || []);
            document.getElementById('devUrl').value = dev.url;
            document.getElementById('devKey').value = dev.key;
            document.getElementById('devId').value = dev.id;

            document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editingDevId').value = '';
            document.getElementById('formTitle').innerText = "Aggiungi Nuovo Dispositivo";
            document.getElementById('btnSave').innerText = "+ Salva Dispositivo";
            document.getElementById('btnCancel').style.display = "none";

            document.getElementById('devNewHouse').value = '';
            document.getElementById('devHouseAddress').value = '';
            document.getElementById('devName').value = '';
            popolaTabellaPin([]);
            document.getElementById('devUrl').value = '';
            document.getElementById('devKey').value = '';
            document.getElementById('devId').value = '';
            document.getElementById('devType').value = 'button';
            gestisciTipoAccesso();
        }

        function eliminaDispositivo(idInternal) {
            if (!confirm("Sei sicuro di voler eliminare questo dispositivo?")) return;
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            dispositivi = dispositivi.filter(d => d.idInternal !== idInternal);
            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            caricaDispositiviAdmin();
        }
    </script>
</body>
</html>
