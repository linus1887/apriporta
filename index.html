<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Shelly Multi-Casa</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 480px; width: 100%; }
        h1 { text-align: center; color: #f8fafc; font-size: 22px; margin-bottom: 20px; }
        h2 { font-size: 16px; margin-bottom: 15px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-top: 0; }
        .house-title { font-size: 18px; color: #f59e0b; margin: 20px 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #94a3b8; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; transition: all 0.2s ease; }
        .btn-add { background-color: #10b981; color: white; margin-top: 5px; }
        .device-item { background-color: #0f172a; padding: 16px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .device-title { font-weight: bold; font-size: 16px; color: #f1f5f9; }
        .btn-trigger { background-color: #2563eb; color: white; padding: 14px; font-size: 16px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-trigger:active { transform: scale(0.96); background-color: #1d4ed8; }
        .btn-trigger:disabled { background-color: #64748b; cursor: not-allowed; box-shadow: none; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .btn-house-share { background-color: #8b5cf6; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .status-msg { font-size: 13px; text-align: center; margin-top: 8px; min-height: 18px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="pageTitle">Controllo Shelly Remote</h1>

        <!-- VISTA OSPITE -->
        <div id="guestView" class="card" style="display: none;">
            <h2 id="guestHouseName">I tuoi Comandi</h2>
            <div id="guestDevicesList"></div>
        </div>

        <!-- VISTA AMMINISTRATORE -->
        <div id="adminView">
            <div class="card">
                <h2>Le Tue Case e Dispositivi</h2>
                <div id="housesContainer"></div>
            </div>

            <div class="card">
                <h2>Aggiungi Nuovo Dispositivo</h2>
                
                <label>Seleziona Casa / Gruppo</label>
                <select id="devHouseSelect" onchange="gestisciSelezioneCasa()">
                    <!-- Popolato dinamicamente da JS -->
                </select>

                <!-- Input nascosto per inserire il nome di una NUOVA casa -->
                <div id="newHouseContainer" style="display: none;">
                    <label>Nome Nuova Casa</label>
                    <input type="text" id="devNewHouse" placeholder="es. Villa Mare, Appartamento 2">
                </div>

                <label>Nome Pulsante / Comando</label>
                <input type="text" id="devName" placeholder="es. Cancello Pedonale, Garage">

                <label>Server URL</label>
                <input type="text" id="devUrl" placeholder="https://shelly-278-eu.shelly.cloud">

                <label>Auth Key</label>
                <input type="text" id="devKey" placeholder="La tua Cloud Auth Key">

                <label>Device ID</label>
                <input type="text" id="devId" placeholder="Es. 1c6920095acc">

                <button class="btn btn-add" onclick="salvaDispositivo()">+ Salva Dispositivo</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const houseDataParam = urlParams.get('houseData');

            if (houseDataParam) {
                // MODALITÀ OSPITE
                try {
                    const houseObj = JSON.parse(decodeURIComponent(houseDataParam));
                    document.getElementById('adminView').style.display = 'none';
                    document.getElementById('guestView').style.display = 'block';
                    document.getElementById('pageTitle').innerText = houseObj.house;
                    document.getElementById('guestHouseName').innerText = "Comandi disponibili:";

                    const container = document.getElementById('guestDevicesList');
                    houseObj.devices.forEach((dev, idx) => {
                        const item = document.createElement('div');
                        item.className = 'device-item';
                        item.innerHTML = `
                            <div class="device-header">
                                <span class="device-title">${dev.name}</span>
                            </div>
                            <button class="btn btn-trigger" id="gbtn-${idx}" onclick="inviaComando('${dev.url}', '${dev.id}', '${dev.key}', 'gbtn-${idx}', 'gstatus-${idx}')">ATTIVA</button>
                            <div class="status-msg" id="gstatus-${idx}">Premia per attivare</div>
                        `;
                        container.appendChild(item);
                    });
                } catch (e) {
                    alert("Link ospite non valido o corrotto.");
                }
            } else {
                // MODALITÀ ADMIN
                caricaDispositiviAdmin();
            }
        });

        function inviaComando(serverUrl, deviceId, authKey, btnId, statusId) {
            const btn = document.getElementById(btnId);
            const statusDiv = document.getElementById(statusId);

            btn.disabled = true;
            statusDiv.style.color = "#38bdf8";
            statusDiv.innerText = "Invio comando...";

            const cleanUrl = serverUrl.replace(/\/$/, "");
            const endpoint = `${cleanUrl}/device/relay/control`;

            const formData = new URLSearchParams();
            formData.append('id', deviceId);
            formData.append('auth_key', authKey);
            formData.append('channel', '0');
            formData.append('turn', 'on');

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.isok) {
                    statusDiv.style.color = "#4ade80";
                    statusDiv.innerText = "✔ Attivato con successo!";
                } else {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "✖ Errore: " + JSON.stringify(data.errors);
                }
            })
            .catch(() => {
                statusDiv.style.color = "#f87171";
                statusDiv.innerText = "✖ Errore di connessione";
            })
            .finally(() => {
                setTimeout(() => { btn.disabled = false; }, 3000);
            });
        }

        function caricaDispositiviAdmin() {
            const container = document.getElementById('housesContainer');
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];

            // Aggiorna anche la select delle case
            popolaMenuCase(dispositivi);

            if (dispositivi.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #64748b;">Nessun dispositivo presente.</p>';
                return;
            }

            const caseGroup = {};
            dispositivi.forEach((dev, originalIndex) => {
                const houseName = dev.house || "Principale";
                if (!caseGroup[houseName]) caseGroup[houseName] = [];
                caseGroup[houseName].push({ ...dev, originalIndex });
            });

            container.innerHTML = '';

            for (const houseName in caseGroup) {
                const houseDiv = document.createElement('div');
                houseDiv.innerHTML = `
                    <div class="house-title">
                        <span>🏠 ${houseName}</span>
                        <button class="btn-house-share" onclick="copiaLinkCasa('${houseName}')">🔗 Copia Link Casa</button>
                    </div>
                `;

                caseGroup[houseName].forEach((dev) => {
                    const idx = dev.originalIndex;
                    const item = document.createElement('div');
                    item.className = 'device-item';
                    item.innerHTML = `
                        <div class="device-header">
                            <span class="device-title">${dev.name}</span>
                            <button class="btn-delete" onclick="eliminaDispositivo(${idx})">Elimina</button>
                        </div>
                        <button class="btn btn-trigger" id="btn-${idx}" onclick="inviaComando('${dev.url}', '${dev.id}', '${dev.key}', 'btn-${idx}', 'status-${idx}')">ATTIVA RELÈ</button>
                        <div class="status-msg" id="status-${idx}">Premia per attivare</div>
                    `;
                    houseDiv.appendChild(item);
                });

                container.appendChild(houseDiv);
            }
        }

        function popolaMenuCase(dispositivi) {
            const select = document.getElementById('devHouseSelect');
            
            // Estrae i nomi unici delle case esistenti
            const caseUniche = [...new Set(dispositivi.map(d => d.house || "Principale"))];
            
            if (caseUniche.length === 0) {
                caseUniche.push("Principale");
            }

            select.innerHTML = '';
            
            // Popola le opzioni esistenti
            caseUniche.forEach(casa => {
                const opt = document.createElement('option');
                opt.value = casa;
                opt.innerText = casa;
                select.appendChild(opt);
            });

            // Aggiunge l'opzione per creare una nuova casa
            const optNew = document.createElement('option');
            optNew.value = "NEW_HOUSE";
            optNew.innerText = "➕ Crea nuova casa...";
            select.appendChild(optNew);

            gestisciSelezioneCasa();
        }

        function gestisciSelezioneCasa() {
            const select = document.getElementById('devHouseSelect');
            const newHouseContainer = document.getElementById('newHouseContainer');

            if (select.value === "NEW_HOUSE") {
                newHouseContainer.style.display = "block";
            } else {
                newHouseContainer.style.display = "none";
            }
        }

        function copiaLinkCasa(houseName) {
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            const houseDevices = dispositivi
                .filter(d => (d.house || "Principale") === houseName)
                .map(d => ({ name: d.name, url: d.url, key: d.key, id: d.id }));

            const payload = {
                house: houseName,
                devices: houseDevices
            };

            const baseUrl = window.location.href.split('?')[0];
            const encodedData = encodeURIComponent(JSON.stringify(payload));
            const fullUrl = `${baseUrl}?houseData=${encodedData}`;

            navigator.clipboard.writeText(fullUrl).then(() => {
                alert(`✔ Link per "${houseName}" copiato negli appunti!\n\nL'ospite vedrà tutti i tasti di questa casa.`);
            }).catch(() => {
                prompt("Copia manualmente il link:", fullUrl);
            });
        }

        function salvaDispositivo() {
            const select = document.getElementById('devHouseSelect');
            let house = select.value;

            // Se è selezionato "Crea nuova casa", usa il valore del campo di testo dedicato
            if (house === "NEW_HOUSE") {
                house = document.getElementById('devNewHouse').value.trim();
                if (!house) {
                    alert("Inserisci un nome per la nuova casa!");
                    return;
                }
            }

            const name  = document.getElementById('devName').value.trim();
            const url   = document.getElementById('devUrl').value.trim().replace(/\/$/, "");
            const key   = document.getElementById('devKey').value.trim();
            const id    = document.getElementById('devId').value.trim();

            if (!name || !url || !key || !id) {
                alert("Compila tutti i campi obbligatori!");
                return;
            }

            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            dispositivi.push({ house, name, url, key, id });

            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));

            // Reset campi
            document.getElementById('devNewHouse').value = '';
            document.getElementById('devName').value = '';
            document.getElementById('devUrl').value = '';
            document.getElementById('devKey').value = '';
            document.getElementById('devId').value = '';

            caricaDispositiviAdmin();
        }

        function eliminaDispositivo(index) {
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            dispositivi.splice(index, 1);
            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            caricaDispositiviAdmin();
        }
    </script>
</body>
</html>
