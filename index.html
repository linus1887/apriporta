<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apriporta Shelly</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px;
        }
        .container {
            text-align: center;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 25px;
            color: #e2e8f0;
        }
        .btn {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #2563eb;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
            background-color: #1d4ed8;
        }
        .btn:disabled {
            background-color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Controllo Shelly Remote</h1>
        <button id="mainBtn" class="btn" onclick="attivaRelay()">Attiva Relè</button>
        <div id="status">Premia il pulsante per attivare</div>
    </div>

    <script>
        // =========================================================
        // INSERISCI QUI I TRE DATI CHE HAI RECUPERATO:
        // =========================================================
        
        const serverUrl = "https://shelly-278-eu.shelly.cloud";   // Es. https://shelly-42-eu.shelly.cloud
        const authKey   = "MjhmYzlhdWlkD629E35BB1288E526F6E5EA6AB0D7626360B4856675F8E98F43BE86A87BEC127B912184F320B1224";    // Es. M2YxNDI3aW5...
        const deviceId  = "1c6920095acc";    // Es. 483dda40a1b2

        // =========================================================

function attivaRelay() {
    const btn = document.getElementById('mainBtn');
    const statusDiv = document.getElementById('status');

    btn.disabled = true;
    statusDiv.style.color = "#38bdf8";
    statusDiv.innerText = "Invio comando in corso...";

    const cleanUrl = serverUrl.replace(/\/$/, "");
    
    // Costruiamo l'URL passando i dati in GET (Query Parameters)
    const requestUrl = `${cleanUrl}/device/relay/control?id=${encodeURIComponent(deviceId)}&auth_key=${encodeURIComponent(authKey)}&channel=0&turn=on`;

    fetch(requestUrl, {
        method: 'GET',
        mode: 'no-cors' // Bypassa il blocco CORS del browser
    })
    .then(() => {
        // Con no-cors il browser non permette di leggere la risposta (data.isok),
        // ma se la richiesta parte senza errori di rete, il comando è stato inviato!
        statusDiv.style.color = "#4ade80";
        statusDiv.innerText = "✔ Comando inviato allo Shelly!";
    })
    .catch(error => {
        statusDiv.style.color = "#f87171";
        statusDiv.innerText = "✖ Errore di rete: " + error.message;
    })
    .finally(() => {
        setTimeout(() => {
            btn.disabled = false;
        }, 3000);
    });
}
    </script>

</body>
</html>
