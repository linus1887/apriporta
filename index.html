<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Shelly Remote</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { max-width: 480px; width: 100%; }
        h1 { text-align: center; color: #f8fafc; font-size: 22px; margin-bottom: 20px; }
        h2 { font-size: 16px; margin-bottom: 15px; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-top: 0; }
        
        .folder-card { background-color: #1e293b; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; overflow: hidden; }
        .folder-header { background-color: #334155; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .folder-header:hover { background-color: #475569; }
        .folder-title { font-size: 16px; font-weight: bold; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        .folder-content { padding: 16px; display: none; }
        .folder-card.open .folder-content { display: block; }
        .folder-card.open .folder-header { background-color: #1e293b; border-bottom: 1px solid #334155; }
        
        .house-address { font-size: 13px; color: #94a3b8; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
        .house-address a { color: #38bdf8; text-decoration: none; }
        
        .card { background-color: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #94a3b8; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #38bdf8; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-add { background-color: #10b981; color: white; margin-top: 5px; }
        .btn-edit { background-color: #f59e0b; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
        .btn-delete { background-color: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; }
        .btn-house-share { background-color: #8b5cf6; color: white; border: none; padding: 8px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; margin-bottom: 15px; width: 100%; }
        
        .device-item { background-color: #0f172a; padding: 16px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
        .device-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .device-title { font-weight: bold; font-size: 16px; color: #f1f5f9; }
        .btn-trigger { background-color: #2563eb; color: white; padding: 14px; font-size: 16px; }
        .btn-trigger:disabled { background-color: #64748b; cursor: not-allowed; }
        .status-msg { font-size: 13px; text-align: center; margin-top: 8px; min-height: 18px; color: #94a3b8; }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .keypad-btn { background-color: #334155; color: white; font-size: 20px; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .keypad-btn:active { background-color: #38bdf8; }
        .pin-display { text-align: center; font-size: 24px; letter-spacing: 8px; margin-bottom: 10px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; min-height: 48px; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="pageTitle">Controllo Shelly Remote</h1>

        <!-- VISTA OSPITE -->
        <div id="guestView" class="card" style="display: none;">
            <div id="guestHouseHeader"></div>
            <div id="guestDevicesList"></div>
        </div>

        <!-- VISTA AMMINISTRATORE -->
        <div id="adminView">
            <div class="card">
                <h2>Cartelle Appartamenti</h2>
                <div id="housesContainer"></div>
            </div>

            <div class="card" id="formCard">
                <h2 id="formTitle">Aggiungi Nuovo Dispositivo</h2>
                <input type="hidden" id="editingDevId" value="">
                
                <label>Seleziona Casa / Cartella</label>
                <select id="devHouseSelect" onchange="gestisciSelezioneCasa()"></select>

                <div id="newHouseContainer" style="display: none;">
                    <label>Nome Nuova Casa</label>
                    <input type="text" id="devNewHouse" placeholder="es. Appartamento Mare">
                    
                    <label>Indirizzo della Casa</label>
                    <input type="text" id="devHouseAddress" placeholder="es. Via Roma 123, Milano">
                </div>

                <label>Nome Pulsante / Comando</label>
                <input type="text" id="devName" placeholder="es. Portone Palazzo, Porta Appartamento">

                <label>Tipo Accesso</label>
                <select id="devType" onchange="gestisciTipoAccesso()">
                    <option value="button">🏢 Portone Palazzo (Tasto Diretto)</option>
                    <option value="pin">🔑 Porta Appartamento (Tastierino PIN)</option>
                </select>

                <div id="pinContainer" style="display: none;">
                    <label>PIN di Sblocco Porta (Numerico)</label>
                    <input type="password" id="devPin" placeholder="es. 1234" maxlength="6" inputmode="numeric">
                </div>

                <label>Server URL</label>
                <input type="text" id="devUrl" placeholder="https://shelly-278-eu.shelly.cloud">

                <label>Auth Key</label>
                <input type="text" id="devKey" placeholder="La tua Cloud Auth Key">

                <label>Device ID</label>
                <input type="text" id="devId" placeholder="Es. 1c6920095acc">

                <button class="btn btn-add" id="btnSave" onclick="salvaDispositivo()">+ Salva Dispositivo</button>
                <button class="btn" id="btnCancel" onclick="resetForm()" style="display:none; background-color: #64748b; margin-top: 8px;">Annulla Modifica</button>
            </div>
        </div>
    </div>

    <script>
        const currentPins = {};

        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const houseIdParam = urlParams.get('houseId');

            if (houseIdParam) {
                // MODALITÀ OSPITE BASATA SU ID PERMANENTE
                document.getElementById('adminView').style.display = 'none';
                document.getElementById('guestView').style.display = 'block';

                let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
                let houseDevices = dispositivi.filter(d => d.houseId === houseIdParam);

                if (houseDevices.length > 0) {
                    const houseObj = houseDevices[0];
                    document.getElementById('pageTitle').innerText = houseObj.house;

                    const addressHtml = houseObj.address 
                        ? `<div class="house-address">📍 <a href="https://maps.google.com/?q=${encodeURIComponent(houseObj.address)}" target="_blank">${houseObj.address}</a></div>` 
                        : '';

                    document.getElementById('guestHouseHeader').innerHTML = `
                        <div style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 15px;">
                            <h2 style="border:none; margin:0; color:#f59e0b;">🏠 ${houseObj.house}</h2>
                            ${addressHtml}
                        </div>
                    `;

                    const container = document.getElementById('guestDevicesList');
                    container.innerHTML = '';
                    houseDevices.forEach((dev, idx) => {
                        container.appendChild(generaElementoDispositivo(dev, idx, true));
                    });
                } else {
                    document.getElementById('guestView').innerHTML = '<p style="text-align:center;">Appartamento non trovato o rimosso.</p>';
                }
            } else {
                caricaDispositiviAdmin();
            }
        });

        function generaElementoDispositivo(dev, idx, isGuest = false) {
            const item = document.createElement('div');
            item.className = 'device-item';
            const statusId = isGuest ? `gstatus-${idx}` : `status-${idx}`;

            const actionButtons = !isGuest ? `
                <div>
                    <button class="btn-edit" onclick="caricaInModifica('${dev.idInternal}')">✏️ Edit</button>
                    <button class="btn-delete" onclick="eliminaDispositivo('${dev.idInternal}')">Elimina</button>
                </div>
            ` : '';

            if (dev.type === 'pin') {
                item.innerHTML = `
                    <div class="device-header">
                        <span class="device-title">🔑 ${dev.name}</span>
                        ${actionButtons}
                    </div>
                    <div class="pin-display" id="pin-display-${idx}">••••</div>
                    <div class="keypad">
                        ${[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(val => `
                            <button class="keypad-btn" onclick="gestisciPinInput('${val}', ${idx}, '${dev.url}', '${dev.id}', '${dev.key}', '${dev.pin}', '${statusId}')">${val}</button>
                        `).join('')}
                    </div>
                    <div class="status-msg" id="${statusId}">Inserisci il PIN per aprire</div>
                `;
            } else {
                const btnId = isGuest ? `gbtn-${idx}` : `btn-${idx}`;
                item.innerHTML = `
                    <div class="device-header">
                        <span class="device-title">🏢 ${dev.name}</span>
                        ${actionButtons}
                    </div>
                    <button class="btn btn-trigger" id="${btnId}" onclick="inviaComando('${dev.url}', '${dev.id}', '${dev.key}', '${btnId}', '${statusId}')">
                        ${isGuest ? 'ATTIVA PORTONE' : 'TEST ATTIVAZIONE'}
                    </button>
                    <div class="status-msg" id="${statusId}">Premi per attivare</div>
                `;
            }
            return item;
        }

        function gestisciPinInput(val, index, url, id, key, correctPin, statusId) {
            if (!currentPins[index]) currentPins[index] = "";
            const display = document.getElementById(`pin-display-${index}`);
            const statusDiv = document.getElementById(statusId);

            if (val === 'C') {
                currentPins[index] = "";
                display.innerText = "••••";
                statusDiv.innerText = "Inserisci il PIN per aprire";
            } else if (val === 'OK') {
                if (currentPins[index] === correctPin) {
                    inviaComando(url, id, key, null, statusId);
                } else {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "✖ PIN Errato!";
                }
                currentPins[index] = "";
                display.innerText = "••••";
            } else {
                if (currentPins[index].length < 6) {
                    currentPins[index] += val;
                    display.innerText = "•".repeat(currentPins[index].length);
                }
            }
        }

        function inviaComando(serverUrl, deviceId, authKey, btnId, statusId) {
            const btn = btnId ? document.getElementById(btnId) : null;
            const statusDiv = document.getElementById(statusId);

            if (btn) btn.disabled = true;
            statusDiv.style.color = "#38bdf8";
            statusDiv.innerText = "Invio comando...";

            const cleanUrl = serverUrl.replace(/\/$/, "");
            const endpoint = `${cleanUrl}/device/relay/control`;

            const formData = new URLSearchParams();
            formData.append('id', deviceId);
            formData.append('auth_key', authKey);
            formData.append('channel', '0');
            formData.append('turn', 'on');

            fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.isok) {
                    statusDiv.style.color = "#4ade80";
                    statusDiv.innerText = "✔ Attivato con successo!";
                } else {
                    statusDiv.style.color = "#f87171";
                    statusDiv.innerText = "✖ Errore: " + JSON.stringify(data.errors);
                }
            })
            .catch(() => {
                statusDiv.style.color = "#f87171";
                statusDiv.innerText = "✖ Errore di connessione";
            })
            .finally(() => {
                if (btn) setTimeout(() => { btn.disabled = false; }, 3000);
            });
        }

        function caricaDispositiviAdmin() {
            const container = document.getElementById('housesContainer');
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];

            popolaMenuCase(dispositivi);

            if (dispositivi.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #64748b;">Nessun appartamento presente.</p>';
                return;
            }

            const caseGroup = {};
            dispositivi.forEach((dev) => {
                const houseName = dev.house || "Principale";
                if (!caseGroup[houseName]) caseGroup[houseName] = [];
                caseGroup[houseName].push(dev);
            });

            container.innerHTML = '';

            for (const houseName in caseGroup) {
                const houseObj = caseGroup[houseName][0];
                const houseAddress = houseObj.address || "";
                const houseId = houseObj.houseId;

                const addressHtml = houseAddress 
                    ? `<div class="house-address">📍 <a href="https://maps.google.com/?q=${encodeURIComponent(houseAddress)}" target="_blank">${houseAddress}</a></div>` 
                    : '';

                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder-card';
                folderDiv.innerHTML = `
                    <div class="folder-header" onclick="this.parentElement.classList.toggle('open')">
                        <div class="folder-title">📁 ${houseName}</div>
                        <span style="font-size: 12px; color: #94a3b8;">▼</span>
                    </div>
                    <div class="folder-content">
                        ${addressHtml}
                        <button class="btn-house-share" onclick="copiaLinkCasa('${houseId}')">🔗 Copia Link Permanentemente Valido per Ospite</button>
                        <div id="dev-list-${houseId}"></div>
                    </div>
                `;

                const devListContainer = folderDiv.querySelector(`#dev-list-${houseId}`);
                caseGroup[houseName].forEach((dev, idx) => {
                    devListContainer.appendChild(generaElementoDispositivo(dev, idx, false));
                });

                container.appendChild(folderDiv);
            }
        }

        function popolaMenuCase(dispositivi) {
            const select = document.getElementById('devHouseSelect');
            const caseUniche = [...new Set(dispositivi.map(d => d.house || "Principale"))];

            select.innerHTML = '';
            caseUniche.forEach(casa => {
                const opt = document.createElement('option');
                opt.value = casa;
                opt.innerText = casa;
                select.appendChild(opt);
            });

            const optNew = document.createElement('option');
            optNew.value = "NEW_HOUSE";
            optNew.innerText = "➕ Nuova cartella / casa...";
            select.appendChild(optNew);

            gestisciSelezioneCasa();
        }

        function gestisciSelezioneCasa() {
            const select = document.getElementById('devHouseSelect');
            const newHouseContainer = document.getElementById('newHouseContainer');
            newHouseContainer.style.display = select.value === "NEW_HOUSE" ? "block" : "none";
        }

        function gestisciTipoAccesso() {
            const type = document.getElementById('devType').value;
            const pinContainer = document.getElementById('pinContainer');
            pinContainer.style.display = type === 'pin' ? 'block' : 'none';
        }

        function copiaLinkCasa(houseId) {
            const baseUrl = window.location.href.split('?')[0];
            const fullUrl = `${baseUrl}?houseId=${houseId}`;

            navigator.clipboard.writeText(fullUrl).then(() => {
                alert(`✔ Link PERMANENTE copiato negli appunti! Se modifichi le impostazioni dell'appartamento, questo link si aggiornerà automaticamente.`);
            }).catch(() => {
                prompt("Copia manualmente il link permanente:", fullUrl);
            });
        }

        function salvaDispositivo() {
            const editingId = document.getElementById('editingDevId').value;
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];

            const select = document.getElementById('devHouseSelect');
            let house = "";
            let address = "";
            let houseId = "";

            if (select.value === "NEW_HOUSE") {
                house = document.getElementById('devNewHouse').value.trim();
                address = document.getElementById('devHouseAddress').value.trim();
                houseId = 'house_' + Date.now();
            } else {
                house = select.value;
                const devEsistente = dispositivi.find(d => d.house === house);
                address = devEsistente ? (devEsistente.address || "") : "";
                houseId = devEsistente ? devEsistente.houseId : ('house_' + Date.now());
            }

            const name = document.getElementById('devName').value.trim();
            const type = document.getElementById('devType').value;
            const pin  = document.getElementById('devPin').value.trim();
            const url  = document.getElementById('devUrl').value.trim().replace(/\/$/, "");
            const key  = document.getElementById('devKey').value.trim();
            const id   = document.getElementById('devId').value.trim();

            if (!house || !name || !url || !key || !id) {
                alert("Compila tutti i campi obbligatori!");
                return;
            }

            if (type === 'pin' && !pin) {
                alert("Inserisci un PIN per la porta!");
                return;
            }

            if (editingId) {
                // MODIFICA DISPOSITIVO ESISTENTE
                const index = dispositivi.findIndex(d => d.idInternal === editingId);
                if (index !== -1) {
                    dispositivi[index] = { 
                        ...dispositivi[index], 
                        house, 
                        address, 
                        name, 
                        type, 
                        pin, 
                        url, 
                        key, 
                        id 
                    };
                    
                    // Aggiorna anche l'indirizzo per gli altri dispositivi della stessa casa
                    dispositivi.forEach(d => {
                        if(d.houseId === houseId) d.address = address;
                    });
                }
            } else {
                // NUOVO DISPOSITIVO
                const idInternal = 'dev_' + Date.now();
                dispositivi.push({ idInternal, houseId, house, address, name, type, pin, url, key, id });
            }

            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            resetForm();
            caricaDispositiviAdmin();
        }

        function caricaInModifica(idInternal) {
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            const dev = dispositivi.find(d => d.idInternal === idInternal);

            if (!dev) return;

            document.getElementById('editingDevId').value = dev.idInternal;
            document.getElementById('formTitle').innerText = "✏️ Modifica Dispositivo";
            document.getElementById('btnSave').innerText = "Salva Modifiche";
            document.getElementById('btnCancel').style.display = "block";

            document.getElementById('devHouseSelect').value = dev.house;
            gestisciSelezioneCasa();

            document.getElementById('devName').value = dev.name;
            document.getElementById('devType').value = dev.type;
            gestisciTipoAccesso();

            document.getElementById('devPin').value = dev.pin || '';
            document.getElementById('devUrl').value = dev.url;
            document.getElementById('devKey').value = dev.key;
            document.getElementById('devId').value = dev.id;

            document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('editingDevId').value = '';
            document.getElementById('formTitle').innerText = "Aggiungi Nuovo Dispositivo";
            document.getElementById('btnSave').innerText = "+ Salva Dispositivo";
            document.getElementById('btnCancel').style.display = "none";

            document.getElementById('devNewHouse').value = '';
            document.getElementById('devHouseAddress').value = '';
            document.getElementById('devName').value = '';
            document.getElementById('devPin').value = '';
            document.getElementById('devUrl').value = '';
            document.getElementById('devKey').value = '';
            document.getElementById('devId').value = '';
            document.getElementById('devType').value = 'button';
            gestisciTipoAccesso();
        }

        function eliminaDispositivo(idInternal) {
            if (!confirm("Sei sicuro di voler eliminare questo dispositivo?")) return;
            let dispositivi = JSON.parse(localStorage.getItem('shelly_devices')) || [];
            dispositivi = dispositivi.filter(d => d.idInternal !== idInternal);
            localStorage.setItem('shelly_devices', JSON.stringify(dispositivi));
            caricaDispositiviAdmin();
        }
    </script>
</body>
</html>
